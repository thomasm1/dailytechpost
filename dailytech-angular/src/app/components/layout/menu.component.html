<div class="menu">
  <mat-toolbar color="primary">
    <div class="logo-box" routerLink="/">
      <img
        class="logo"
        alt="DailyTech Logo"
        src="assets/blueColorTriomphe.png"
      />
    </div>

    <span class="spacer"></span>

    <div class="hide-gt-xs">
      <button mat-icon-button (click)="onToggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
 
    <div class="menu-center hide-xs" id="menu-list">
      <mat-nav-list class="navigation-items nav-gap-10">
        <a
          mat-list-item
          routerLink="/writing/"
          routerLinkActive="active-link"
          class="nav-link daily-tech monoton"
          >WRITE!
        </a>
 
        <a
          mat-list-item
          routerLink=""
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link daily-tech monoton"
          >BLOG</a
        >

       <a
        mat-list-item
        *ngIf="authPolicy.canAccessAdmin()"
        [routerLink]="['/admin', awsAuthService.getAuthenticatedUser()]"
        routerLinkActive="active-link"
        class="nav-link daily-tech monoton">
        ADMIN
      </a>
      
        <a
          mat-list-item *ngIf="authPolicy.canAccessAdmin()" 
          routerLink="/stats"
          routerLinkActive="active-link"
          class="nav-link daily-tech monoton"
          ><mat-icon>bar_chart</mat-icon>STATS
        </a> 
       <a
        mat-list-item *ngIf="authPolicy.canAccessAdmin()" 
        routerLink="/visuals"
        routerLinkActive="active-link"
        class="nav-link daily-tech monoton"
        ><mat-icon>pie_chart</mat-icon>Visuals
        </a>

        <a
          mat-list-item
          routerLink="/news"
          routerLinkActive="active-link"
          class="nav-link daily-tech monoton"
          >NEWS</a
        > 
       
        <a
          mat-list-item
          *ngIf="!authPolicy.canAccessAdmin() && !(isAuth$ | async)"
          routerLink="/login"
          routerLinkActive="active-link"
          class="nav-link daily-tech monoton"
          >LOGIN</a
        >
        <a
          mat-list-item
          class="pointer"
          *ngIf="(isAuth$ | async) || authPolicy.canAccessAdmin()"
          (click)="onLogout()"
          routerLink="/login"
          routerLinkActive="active-link"
          class="nav-link daily-tech monoton"
          >SIGN OUT</a
        >
      </mat-nav-list>
    </div>
  </mat-toolbar>
</div>
